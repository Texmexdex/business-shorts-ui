<form id="uploadForm">
            <label>1. Upload Visuals (Order Matters)</label>
            <label for="files" class="file-upload" id="drop-zone">
                Tap to Select Images/Videos
            </label>
            <input type="file" id="files" multiple accept="image/*,video/*" onchange="updateCount()">
            
            <label>2. Background Audio (Optional)</label>
            <label for="audio" class="file-upload" id="audio-zone" style="padding: 15px; margin-bottom: 20px;">
                Tap to Select Music/Voiceover
            </label>
            <input type="file" id="audio" accept="audio/*" onchange="updateAudioCount()">

            <label>3. Transition Style</label>
            <select id="transition">
                <option value="Split">Barn Door Split (Sleek)</option>
                <option value="Cut">Hard Cut</option>
            </select>

            <button type="submit" id="submitBtn">Generate Video</button>
        </form>

<script>
        const API_URL = "https://texmexdex-auto-shorts.hf.space/render"; 

        const fileInput = document.getElementById('files');
        const audioInput = document.getElementById('audio');
        const dropZone = document.getElementById('drop-zone');
        const audioZone = document.getElementById('audio-zone');

        function updateCount() {
            if(fileInput.files.length > 0) {
                dropZone.innerText = fileInput.files.length + " visuals selected";
                dropZone.style.borderColor = "#00ff9d";
            }
        }

        function updateAudioCount() {
            if(audioInput.files.length > 0) {
                audioZone.innerText = "🎵 " + audioInput.files[0].name;
                audioZone.style.borderColor = "#00ff9d";
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if(fileInput.files.length === 0) {
                alert("Please select visual files first!");
                return;
            }

            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('status');
            const loader = document.getElementById('loader');
            const dlArea = document.getElementById('download-area');

            dlArea.style.display = 'none';
            btn.disabled = true;
            btn.innerText = "Processing...";
            loader.style.display = 'block';
            status.innerText = "Uploading & Rendering...";

            const formData = new FormData();
            
            // Append Visuals
            for (let i = 0; i < fileInput.files.length; i++) {
                formData.append('files', fileInput.files[i]);
            }
            
            // Append Audio (if exists)
            if (audioInput.files.length > 0) {
                formData.append('audio_file', audioInput.files[0]);
            }

            formData.append('transition', document.getElementById('transition').value);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Server Error (Check HF Logs)");

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                
                document.getElementById('download-link').href = url;
                dlArea.style.display = 'block';
                status.innerText = "";
            } catch (error) {
                status.innerText = "Error: " + error.message;
            } finally {
                btn.disabled = false;
                btn.innerText = "GENERATE VIDEO";
                loader.style.display = 'none';
            }
        });
    </script>
