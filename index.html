<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTOSHORTS | PRO</title>
    <style>
        :root { 
            --bg: #050505; 
            --panel: #111111; 
            --border: #333333; 
            --text-main: #e0e0e0; 
            --text-dim: #666666; 
            --accent: #ffffff; 
            --error: #cf6679;
        }
        
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            letter-spacing: 0.5px;
        }
        
        .interface { 
            width: 100%; 
            max-width: 600px; 
            border: 1px solid var(--border); 
            background: var(--panel);
        }

        /* HEADER */
        header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; color: var(--accent); }
        .status-dot { height: 8px; width: 8px; background-color: #333; border-radius: 50%; display: inline-block; }
        .status-dot.active { background-color: var(--accent); box-shadow: 0 0 10px var(--accent); }

        /* SECTIONS */
        .section { padding: 0; border-bottom: 1px solid var(--border); }
        .section:last-child { border-bottom: none; }
        
        .section-header {
            padding: 15px 20px;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-dim);
            font-weight: 600;
            background: #0a0a0a;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
        }

        /* CONTROLS */
        .control-row { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 15px;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        button:hover { border-color: var(--accent); color: var(--accent); }
        button:active { background: var(--accent); color: black; }
        button:disabled { border-color: #222; color: #444; cursor: not-allowed; }

        .btn-primary { background: var(--accent); color: black; border: none; width: 100%; }
        .btn-primary:hover { background: #ddd; }
        
        input[type="file"] { display: none; }
        
        select {
            width: 100%;
            padding: 15px;
            background: #0a0a0a;
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 0;
            font-size: 12px;
            text-transform: uppercase;
            appearance: none;
            cursor: pointer;
        }
        select:focus { outline: 1px solid var(--accent); }

        /* QUEUE LIST */
        .queue-list { list-style: none; padding: 0; margin: 0; }
        .queue-item {
            padding: 15px 20px;
            border-bottom: 1px solid #222;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .queue-item:last-child { border-bottom: none; }
        .queue-meta { font-family: 'Courier New', monospace; font-size: 11px; color: var(--text-dim); }

        /* AUDIO BAR */
        .audio-bar {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 12px;
        }
        .audio-indicator { width: 4px; height: 15px; background: #333; }
        .audio-indicator.active { background: var(--accent); }

        /* OUTPUT */
        #output-area { display: none; padding: 20px; text-align: center; background: #0f0f0f; }
        .d-link { color: var(--text-main); text-decoration: none; border-bottom: 1px solid var(--accent); padding-bottom: 2px; font-size: 12px; text-transform: uppercase; }

    </style>
</head>
<body>

    <div class="interface">
        <header>
            <h1>AutoShorts <span style="font-weight:300; opacity:0.5;">// STUDIO</span></h1>
            <div class="status-dot" id="server-status"></div>
        </header>

        <div class="section">
            <div class="section-header">
                <span>01. Visual Sequence</span>
                <span id="count-display">0 CLIPS</span>
            </div>
            <ul class="queue-list" id="queueList">
                <li class="queue-item" style="color: #444; justify-content: center; font-style: italic;">
                    No media selected
                </li>
            </ul>
            <div class="control-row" style="grid-template-columns: 1fr auto;">
                <button onclick="document.getElementById('vidInput').click()">+ Append Clip</button>
                <button onclick="clearQueue()" style="border-color: #332222; color: #884444;">Reset</button>
            </div>
            <input type="file" id="vidInput" accept="image/*,video/*" onchange="addVisual(this)">
        </div>

        <div class="section">
            <div class="section-header">02. Audio Track</div>
            <div class="audio-bar">
                <div class="audio-indicator" id="audio-dot"></div>
                <span id="audio-name" style="color: #666;">NO AUDIO SOURCE</span>
                <button onclick="document.getElementById('audInput').click()" style="margin-left: auto; padding: 8px 15px;">Select File</button>
            </div>
            <input type="file" id="audInput" accept="audio/*" onchange="setAudio(this)">
        </div>

        <div class="section">
            <div class="section-header">03. Rendering Parameters</div>
            <div class="control-row">
                <select id="transition">
                    <option value="Split_BarnDoor">Split: Barn Door (H)</option>
                    <option value="Split_Quad">Split: Quad Grid</option>
                    <option value="Split_Diagonal">Split: Diagonal Slice</option>
                    <option value="Cellular_Growth">Mask: Cellular Growth</option>
                    <option value="Dissolve_Luma">Mask: Luma Fade</option>
                    <option value="Slide_Push">Slide: Kinetic Push</option>
                </select>
                <button class="btn-primary" id="renderBtn" onclick="processJob()">INITIATE RENDER</button>
            </div>
        </div>
        
        <div id="output-area">
            <p id="status-text" style="font-size: 11px; margin-bottom: 15px; color: #666;">PROCESSING...</p>
            <a id="dl-link" class="d-link" href="#" download>Download Final_Render.mp4</a>
        </div>
    </div>

    <script>
        const API_URL = "https://texmexdex-auto-shorts.hf.space/render"; // VERIFY THIS URL
        
        let visualQueue = [];
        let audioFile = null;

        function addVisual(input) {
            if(input.files[0]) {
                visualQueue.push(input.files[0]);
                renderList();
                input.value = "";
            }
        }

        function renderList() {
            const list = document.getElementById('queueList');
            const count = document.getElementById('count-display');
            list.innerHTML = "";
            
            if(visualQueue.length === 0) {
                list.innerHTML = '<li class="queue-item" style="color:#444; justify-content:center;">No media selected</li>';
            } else {
                visualQueue.forEach((file, i) => {
                    const li = document.createElement('li');
                    li.className = 'queue-item';
                    li.innerHTML = `
                        <span>${i+1}. ${file.name}</span>
                        <span class="queue-meta">${(file.size/1024/1024).toFixed(1)}MB</span>
                    `;
                    list.appendChild(li);
                });
            }
            count.innerText = visualQueue.length + " CLIPS";
        }

        function setAudio(input) {
            if(input.files[0]) {
                audioFile = input.files[0];
                document.getElementById('audio-name').innerText = audioFile.name.toUpperCase();
                document.getElementById('audio-name').style.color = "#e0e0e0";
                document.getElementById('audio-dot').classList.add('active');
            }
        }

        function clearQueue() {
            visualQueue = [];
            renderList();
        }

        async function processJob() {
            if(visualQueue.length < 1) return alert("SEQUENCE EMPTY");

            const btn = document.getElementById('renderBtn');
            const out = document.getElementById('output-area');
            const status = document.getElementById('status-text');
            const link = document.getElementById('dl-link');

            btn.disabled = true;
            btn.innerText = "RENDERING...";
            out.style.display = "block";
            link.style.display = "none";
            status.innerText = "UPLOADING ASSETS & PROCESSING...";

            const formData = new FormData();
            visualQueue.forEach(f => formData.append('files', f));
            if(audioFile) formData.append('audio_file', audioFile);
            formData.append('transition', document.getElementById('transition').value);

            try {
                const res = await fetch(API_URL, { method: 'POST', body: formData });
                if(!res.ok) throw new Error("RENDER FAILED");
                
                const blob = await res.blob();
                link.href = window.URL.createObjectURL(blob);
                link.style.display = "inline";
                status.innerText = "RENDER COMPLETE";
            } catch (e) {
                status.innerText = "ERROR: " + e.message;
            } finally {
                btn.disabled = false;
                btn.innerText = "INITIATE RENDER";
            }
        }
    </script>
</body>
</html>
